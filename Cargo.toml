[package]
name = "quixotic"
version = "1.0.0"
edition = "2021"
description = "Quixotic"
license = "MIT"
build = "build.rs"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
directories = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
